name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo - messy export fails the audit
        run: |
          set +e
          python -m alarm_audit run-all examples/alarms_messy.json examples/inventory_messy.json
          code=$?
          echo "demo exit code: $code"
          test "$code" -eq 2
      - name: Demo - clean export exits 0
        run: python -m alarm_audit run-all examples/alarms_clean.json examples/inventory_clean.json
